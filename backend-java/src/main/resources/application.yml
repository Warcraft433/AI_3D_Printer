server:
  port: ${PORT:8080}
  error:
    include-message: never

spring:
  profiles:
    default: local
  application:
    name: printguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/printguard}
    username: ${SPRING_DATASOURCE_USERNAME:printguard_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    hibernate:
      # Preserve existing data: validate only; never auto-create/drop production tables.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
            scope: read:user,user:email

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

printguard:
  ai-service-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
  ai-service-api-key: ${AI_SERVICE_API_KEY:}
  slicer-path: ${SLICER_PATH:${PRUSA_SLICER_PATH:}}
  slicer-timeout-seconds: ${SLICER_TIMEOUT_SECONDS:90}
  slicer-profile: ${SLICER_PROFILE:Original Prusa i3 MK3S & MK3S+}
  media-dir: ${MEDIA_DIR:c:/Projects01/AI_3D_Printer/media}
  jwt:
    secret: ${PRINTGUARD_JWT_SECRET:PrintGuardAI-SuperSecretKey-ForJWTTokenSigning-2026-BTechFYP!}
    expiration-ms: ${PRINTGUARD_JWT_EXPIRATION_MS:86400000}
  storage:
    type: ${STORAGE_TYPE:local}
    supabase:
      url: ${SUPABASE_URL:https://wlpskpsysnamtmzilpft.supabase.co}
      service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:printguard-files}
      connect-timeout-ms: ${SUPABASE_STORAGE_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${SUPABASE_STORAGE_READ_TIMEOUT_MS:15000}

resilience4j:
  circuitbreaker:
    instances:
      slicerService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      aiService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      aiService:
        max-attempts: 2
        wait-duration: 500ms
      slicerService:
        max-attempts: 2
        wait-duration: 500ms
  ratelimiter:
    instances:
      slicerService:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 500ms
      aiService:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 500ms

