version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: printguard-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./printguard-migration-starter/migration_seed.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=printguard
      - POSTGRES_USER=printguard_app
      - POSTGRES_PASSWORD=change-this-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printguard_app -d printguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    container_name: printguard-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}

  backend:
    build:
      context: .
      dockerfile: docker/backend-java.Dockerfile
    container_name: printguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/printguard}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-printguard_app}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-change-this-password}
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - SLICER_PATH=${SLICER_PATH:-/usr/bin/prusa-slicer}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - ./backend/media:/app/media
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: printguard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
